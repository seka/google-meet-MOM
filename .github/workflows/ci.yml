name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        # npm ci runs the onnxruntime-node install script, which reads this variable.
        # Browser/extension tests use WASM, so skip downloading the optional CUDA binaries.
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check lint and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Test extension integration in Chromium
        run: npm run test:integration:extension-chromium

      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browser-test-failures
          path: |
            src/**/__screenshots__/**
            src/.vitest-attachments/**
            test-results/**
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Build
        run: npm run build
