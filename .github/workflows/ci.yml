name: CI

on:
  push:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Check lint and formatting
        run: npm run check

      - name: Run tests
        run: npm test

      - name: Test extension integration in Chromium
        run: npm run test:integration:extension-chromium

      - name: Upload browser test failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failures
          path: |
            src/**/__screenshots__/**
            src/.vitest-attachments/**
            test-results/**
          include-hidden-files: true
          if-no-files-found: ignore

      - name: Build
        run: npm run build
