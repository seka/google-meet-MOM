<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <title>Google Meet MOM</title>
    <link rel="stylesheet" href="./sidepanel.css" />
  </head>
  <body>
    <div id="app">
      <header class="app-header">
        <div class="app-header-title">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <span>Google Meet MOM</span>
        </div>
        <span id="status-badge" class="badge badge-idle">待機中</span>
      </header>

      <section id="controls">
        <button id="record-btn" class="btn btn-primary">
          <svg
            id="icon-mic"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
          >
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z" />
            <path d="M19 10v2a7 7 0 0 1-14 0v-2" />
            <line x1="12" x2="12" y1="19" y2="22" />
          </svg>
          <svg
            id="icon-stop"
            xmlns="http://www.w3.org/2000/svg"
            width="18"
            height="18"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="none"
            hidden
          >
            <rect width="14" height="14" x="5" y="5" rx="2" />
          </svg>
          <span id="btn-label">録音開始</span>
        </button>
        <p id="status-message"></p>
      </section>

      <section class="log-section" id="log-section">
        <div class="section-header">
          <span class="section-title">発言ログ</span>
          <span id="processing-indicator" class="badge badge-transcribing" hidden>
            <svg
              class="icon-sm icon-spin"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 12a9 9 0 1 1-6.219-8.56" />
            </svg>
            文字起こし中
          </span>
        </div>
        <div id="log-content" class="log-area">
          <p id="log-placeholder" class="placeholder">
            録音を開始すると、発言内容が順次表示されます。
          </p>
        </div>
      </section>

      <section class="result-section" id="result-section" hidden>
        <div class="section-header">
          <span class="section-title">最終トランスクリプト</span>
        </div>
        <nav class="tabs">
          <button class="tab active" data-tab="transcript">文字起こし</button>
          <button class="tab" data-tab="minutes">議事録</button>
        </nav>

        <div id="transcript-tab" class="tab-content">
          <pre id="transcript-text"></pre>
        </div>
        <div id="minutes-tab" class="tab-content" hidden>
          <pre id="minutes-text"></pre>
        </div>

        <div class="actions">
          <button id="copy-btn" class="btn btn-secondary">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
              <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
            </svg>
            コピー
          </button>
          <button id="download-btn" class="btn btn-secondary">
            <svg
              class="icon"
              xmlns="http://www.w3.org/2000/svg"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
              <polyline points="7 10 12 15 17 10" />
              <line x1="12" x2="12" y1="15" y2="3" />
            </svg>
            ダウンロード
          </button>
        </div>
      </section>
    </div>

    <footer>
      <a href="#" id="open-options">
        <svg
          class="icon-sm"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
          />
          <circle cx="12" cy="12" r="3" />
        </svg>
        設定
      </a>
    </footer>

    <script type="module" src="./sidepanel.ts"></script>
  </body>
</html>
