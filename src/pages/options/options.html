<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>設定 — Google Meet MOM</title>
    <link rel="stylesheet" href="./options.css" />
  </head>
  <body>
    <h1>Google Meet MOM 設定</h1>

    <div class="card">
      <p class="card-title">Ollama</p>
      <div class="field">
        <label for="ollama-url">URL</label>
        <input type="url" id="ollama-url" placeholder="http://localhost:11434" />
        <p class="hint">ローカルで起動している Ollama のエンドポイント</p>
      </div>
      <div class="field">
        <label for="ollama-model">モデル</label>
        <input type="text" id="ollama-model" placeholder="llama3.2" />
        <p class="hint">例: llama3.2, mistral, gemma2</p>
      </div>
    </div>

    <div class="card">
      <p class="card-title">Whisper</p>
      <div class="field">
        <label for="whisper-model">モデル</label>
        <select id="whisper-model">
          <option value="onnx-community/whisper-tiny">whisper-tiny（高速、低精度）</option>
          <option value="onnx-community/whisper-base">whisper-base（バランス）</option>
          <option value="onnx-community/whisper-small">whisper-small（高精度、低速）</option>
        </select>
        <p class="hint">初回使用時にモデルをダウンロードします（tiny: ~150MB）</p>
      </div>
      <div class="field">
        <label for="language">文字起こし言語</label>
        <select id="language">
          <option value="ja">日本語</option>
          <option value="en">英語</option>
        </select>
      </div>
    </div>

    <div class="card">
      <p class="card-title">録音</p>
      <div class="field">
        <label for="chunk-interval">発言ログの更新間隔</label>
        <select id="chunk-interval">
          <option value="10">10 秒</option>
          <option value="15">15 秒（推奨）</option>
          <option value="20">20 秒</option>
          <option value="30">30 秒</option>
          <option value="60">60 秒</option>
        </select>
        <p class="hint">短いほどリアルタイムに近いが、精度が下がる場合があります</p>
      </div>
    </div>

    <div class="save-row">
      <button id="save-btn" class="btn btn-primary">
        <svg
          class="icon"
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2.5"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polyline points="20 6 9 17 4 12" />
        </svg>
        保存
      </button>
      <span id="saved-msg">保存しました</span>
    </div>

    <script type="module" src="./options.ts"></script>
  </body>
</html>
